<svg xmlns="http://www.w3.org/2000/svg" width="760" height="478" viewBox="0 0 760 478" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6573"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="478" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2733">安全设计</text>
  <text x="380" y="56" text-anchor="middle" font-size="12.5" fill="#7a8493">不只靠提示词约束 · 代码本身强制执行 · 三道相互独立的防线</text>

  <!-- ===== 防越权 ===== -->
  <g>
    <rect x="24" y="86" width="226" height="332" rx="10" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.2"/>
    <text x="137" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2733">防越权</text>
    <text x="137" y="137" text-anchor="middle" font-size="11" fill="#7a8493">无法越过只读权限写入或提交</text>

    <rect x="44" y="156" width="186" height="74" rx="7" fill="#ffffff" stroke="#cdd8ec" stroke-width="1"/>
    <text x="137" y="178" text-anchor="middle" font-size="11.5" font-weight="600" fill="#3457a6">SDK 侧：只放行只读工具</text>
    <text x="137" y="198" text-anchor="middle" font-size="10.5" fill="#5b6573">tools=[] · disallowed_tools</text>
    <text x="137" y="216" text-anchor="middle" font-size="10.5" fill="#5b6573">dontAsk · strict_mcp_config</text>

    <rect x="44" y="244" width="186" height="74" rx="7" fill="#ffffff" stroke="#cdd8ec" stroke-width="1"/>
    <text x="137" y="266" text-anchor="middle" font-size="11.5" font-weight="600" fill="#3457a6">服务侧：只开放只读工具</text>
    <text x="137" y="286" text-anchor="middle" font-size="10.5" fill="#5b6573">只注册 ≤9 个只读工具</text>
    <text x="137" y="304" text-anchor="middle" font-size="10.5" fill="#5b6573">不注册即无能力</text>

    <text x="137" y="346" text-anchor="middle" font-size="10.5" font-weight="600" fill="#9aa3b0">以谁为准</text>
    <text x="137" y="366" text-anchor="middle" font-size="10" fill="#7a8493">agent_lib.py（SDK 多层）</text>
    <text x="137" y="384" text-anchor="middle" font-size="10" fill="#7a8493">http_bridge.py（白名单）</text>
    <text x="137" y="404" text-anchor="middle" font-size="10" fill="#7a8493">两层均为只读，不改动任何文件</text>
  </g>

  <!-- ===== 防泄露 ===== -->
  <g>
    <rect x="267" y="86" width="226" height="332" rx="10" fill="#eef6ef" stroke="#9cc6a8" stroke-width="1.2"/>
    <text x="380" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2733">防泄露</text>
    <text x="380" y="137" text-anchor="middle" font-size="11" fill="#7a8493">密钥和内网信息不流出系统</text>

    <rect x="287" y="156" width="186" height="74" rx="7" fill="#ffffff" stroke="#bfe0c6" stroke-width="1"/>
    <text x="380" y="178" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2f7a47">回传群内的字段先脱敏</text>
    <text x="380" y="198" text-anchor="middle" font-size="10.5" fill="#5b6573">用户 / 会话标识 hashUserId</text>
    <text x="380" y="216" text-anchor="middle" font-size="10.5" fill="#5b6573">密钥、内网信息不发进群</text>

    <rect x="287" y="244" width="186" height="74" rx="7" fill="#ffffff" stroke="#bfe0c6" stroke-width="1"/>
    <text x="380" y="266" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2f7a47">凭证不入库</text>
    <text x="380" y="286" text-anchor="middle" font-size="10.5" fill="#5b6573">飞书凭证走 Secrets Manager</text>
    <text x="380" y="304" text-anchor="middle" font-size="10.5" fill="#5b6573">运行时取出注入 env · 不落盘</text>

    <text x="380" y="346" text-anchor="middle" font-size="10.5" font-weight="600" fill="#9aa3b0">以谁为准</text>
    <text x="380" y="366" text-anchor="middle" font-size="10" fill="#7a8493">bot-gateway/src/log.ts</text>
    <text x="380" y="384" text-anchor="middle" font-size="10" fill="#7a8493">bot-gateway/run.sh</text>
    <text x="380" y="404" text-anchor="middle" font-size="10" fill="#7a8493">install.sh（按项目写密钥）</text>
  </g>

  <!-- ===== 防注入 ===== -->
  <g>
    <rect x="510" y="86" width="226" height="332" rx="10" fill="#fdf5e9" stroke="#e4c896" stroke-width="1.2"/>
    <text x="623" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2733">防注入</text>
    <text x="623" y="137" text-anchor="middle" font-size="11" fill="#7a8493">读到的内容里的指令不可信</text>

    <rect x="530" y="156" width="186" height="74" rx="7" fill="#ffffff" stroke="#eedcb8" stroke-width="1"/>
    <text x="623" y="178" text-anchor="middle" font-size="11.5" font-weight="600" fill="#a9772a">代码 / 注释 = 待分析数据</text>
    <text x="623" y="198" text-anchor="middle" font-size="10.5" fill="#5b6573">工具读到的一律当数据</text>
    <text x="623" y="216" text-anchor="middle" font-size="10.5" fill="#5b6573">其中的指令不执行</text>

    <rect x="530" y="244" width="186" height="74" rx="7" fill="#ffffff" stroke="#eedcb8" stroke-width="1"/>
    <text x="623" y="266" text-anchor="middle" font-size="11.5" font-weight="600" fill="#a9772a">信任边界单一</text>
    <text x="623" y="286" text-anchor="middle" font-size="10.5" fill="#5b6573">只信打包进镜像的</text>
    <text x="623" y="304" text-anchor="middle" font-size="10.5" fill="#5b6573">system prompt</text>

    <text x="623" y="346" text-anchor="middle" font-size="10.5" font-weight="600" fill="#9aa3b0">以谁为准</text>
    <text x="623" y="366" text-anchor="middle" font-size="10" fill="#7a8493">prompts/system.md</text>
    <text x="623" y="386" text-anchor="middle" font-size="10" fill="#7a8493">（强约束：只信 prompt</text>
    <text x="623" y="404" text-anchor="middle" font-size="10" fill="#7a8493">不信工具读到的指令）</text>
  </g>

  <text x="380" y="452" text-anchor="middle" font-size="11" fill="#7a8493">逐条「怎么强制 / 以谁为准 / 怎么机检 / 违反后果」见 docs/agent/invariants.md</text>
</svg>
