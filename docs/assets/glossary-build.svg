<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6573"/>
    </marker>
    <marker id="arrowdrop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b46a6a"/>
    </marker>
    <marker id="arrowloop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="280" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2733">术语表怎么构建出来</text>
  <text x="380" y="56" text-anchor="middle" font-size="12.5" fill="#7a8493">index 主机后台离线四步 · 无用户输入 · 不在问答链路上</text>

  <!-- 4 step boxes, evenly spread; centers at 110, 290, 470, 650 -->
  <!-- step 1 -->
  <rect x="34" y="92" width="152" height="78" rx="9" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.2"/>
  <text x="110" y="116" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2733">① 扫代码副本</text>
  <text x="110" y="136" text-anchor="middle" font-size="9.5" fill="#5b6573">代码 / 配置表 / 文档</text>
  <text x="110" y="151" text-anchor="middle" font-size="9.5" fill="#5b6573">全部扫描（不限类型）</text>

  <!-- step 2 -->
  <rect x="214" y="92" width="152" height="78" rx="9" fill="#fdf5e9" stroke="#e4c896" stroke-width="1.2"/>
  <text x="290" y="116" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2733">② 本地 Claude</text>
  <text x="290" y="136" text-anchor="middle" font-size="9.5" fill="#5b6573">限权只读，抽出</text>
  <text x="290" y="151" text-anchor="middle" font-size="9.5" fill="#5b6573">「中文 ↔ 英文符号」</text>

  <!-- step 3 -->
  <rect x="394" y="92" width="152" height="78" rx="9" fill="#eef6ef" stroke="#9cc6a8" stroke-width="1.2"/>
  <text x="470" y="116" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2733">③ 核对原文</text>
  <text x="470" y="136" text-anchor="middle" font-size="9.5" fill="#5b6573">中文须在源文件中实际出现</text>
  <text x="470" y="151" text-anchor="middle" font-size="9.5" fill="#5b6573">对应不上即丢弃</text>

  <!-- step 4 -->
  <rect x="574" y="92" width="152" height="78" rx="9" fill="#eef6ef" stroke="#9cc6a8" stroke-width="1.2"/>
  <text x="650" y="116" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2733">④ 落盘</text>
  <text x="650" y="136" text-anchor="middle" font-size="9.5" fill="#5b6573">对照表文件</text>
  <text x="650" y="151" text-anchor="middle" font-size="9.5" fill="#5b6573">按项目 / 仓分开</text>

  <!-- arrows between steps -->
  <line x1="186" y1="131" x2="214" y2="131" stroke="#5b6573" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="366" y1="131" x2="394" y2="131" stroke="#5b6573" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="546" y1="131" x2="574" y2="131" stroke="#5b6573" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- discard branch off step 3 -->
  <line x1="470" y1="170" x2="470" y2="200" stroke="#b46a6a" stroke-width="1.3" marker-end="url(#arrowdrop)"/>
  <text x="470" y="214" text-anchor="middle" font-size="9.5" fill="#b46a6a">拦截 Claude 凭空翻译的词条</text>

  <!-- incremental loop: from step 4 back to step 1 -->
  <path d="M650 170 V236 H110 V173" fill="none" stroke="#8a93a0" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrowloop)"/>
  <rect x="316" y="227" width="128" height="18" rx="9" fill="#f1f3f7" stroke="#d4dbe6" stroke-width="0.8"/>
  <text x="380" y="240" text-anchor="middle" font-size="9.5" font-weight="600" fill="#7a8493">此后按 git 变更增量重建</text>

  <!-- constraint note -->
  <text x="380" y="270" text-anchor="middle" font-size="9.5" fill="#9aa3b0">三重约束：Claude 限权（只读 / 禁联网）· 产物仅供只读服务 · 代码全程不出这台机器</text>
</svg>
