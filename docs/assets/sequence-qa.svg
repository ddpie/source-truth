<svg xmlns="http://www.w3.org/2000/svg" width="760" height="612" viewBox="0 0 760 612" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6573"/>
    </marker>
    <marker id="arrowback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b7d4f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="612" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2733">一次问答的端到端时序</text>
  <text x="380" y="54" text-anchor="middle" font-size="12.5" fill="#7a8493">实线 = 请求 · 绿线 = 流式回填 · 自上而下按时间推进</text>

  <!-- lifelines: 5 actors -->
  <!-- x centers: 80, 250, 420, 560, 690 -->
  <g font-size="11.5" font-weight="600" fill="#1f2733" text-anchor="middle">
    <rect x="24" y="72" width="112" height="40" rx="7" fill="#f1f3f7" stroke="#cdd5e0"/>
    <text x="80" y="92">飞书客户端</text><text x="80" y="106" font-size="9.5" font-weight="400" fill="#7a8493">策划 @机器人</text>

    <rect x="196" y="72" width="108" height="40" rx="7" fill="#eef3fb" stroke="#b9c9e6"/>
    <text x="250" y="92">bot-gateway</text><text x="250" y="106" font-size="9.5" font-weight="400" fill="#7a8493">长连接 / 路由</text>

    <rect x="368" y="72" width="104" height="40" rx="7" fill="#eef3fb" stroke="#b9c9e6"/>
    <text x="420" y="92">AgentCore</text><text x="420" y="106" font-size="9.5" font-weight="400" fill="#7a8493">microVM Agent</text>

    <rect x="506" y="72" width="108" height="40" rx="7" fill="#eef6ef" stroke="#9cc6a8"/>
    <text x="560" y="92">index-service</text><text x="560" y="106" font-size="9.5" font-weight="400" fill="#7a8493">取证 / 读文件</text>

    <rect x="642" y="72" width="94" height="40" rx="7" fill="#fdf5e9" stroke="#e4c896"/>
    <text x="689" y="92">CardKit</text><text x="689" y="106" font-size="9.5" font-weight="400" fill="#7a8493">流式卡片</text>
  </g>

  <!-- lifelines -->
  <g stroke="#dfe4ea" stroke-width="1.2" stroke-dasharray="3,4">
    <line x1="80" y1="112" x2="80" y2="568"/>
    <line x1="250" y1="112" x2="250" y2="568"/>
    <line x1="420" y1="112" x2="420" y2="568"/>
    <line x1="560" y1="112" x2="560" y2="568"/>
    <line x1="689" y1="112" x2="689" y2="568"/>
  </g>

  <!-- messages -->
  <g font-size="10.5" fill="#3b4654">
    <!-- 1 ask -->
    <line x1="80" y1="140" x2="248" y2="140" stroke="#5b6573" stroke-width="1.3" marker-end="url(#arrow)"/>
    <text x="164" y="134" text-anchor="middle">① 提问（长连接事件，无需轮询）</text>

    <!-- 2 dedup + create card -->
    <line x1="250" y1="170" x2="687" y2="170" stroke="#5b6573" stroke-width="1.3" marker-end="url(#arrow)"/>
    <text x="470" y="164" text-anchor="middle">② 去重 → 建卡「正在思考…」（拿 card_id）</text>
    <line x1="689" y1="196" x2="82" y2="196" stroke="#3b7d4f" stroke-width="1.3" marker-end="url(#arrowback)"/>
    <text x="385" y="190" text-anchor="middle" fill="#2f7a47">卡片即时可见 · 标题带实时计时</text>

    <!-- 3 invoke -->
    <line x1="250" y1="226" x2="418" y2="226" stroke="#5b6573" stroke-width="1.3" marker-end="url(#arrow)"/>
    <text x="334" y="220" text-anchor="middle">③ SigV4 invoke（带 runtimeSessionId）</text>

    <!-- 4 glossary -->
    <line x1="420" y1="256" x2="558" y2="256" stroke="#5b6573" stroke-width="1.3" marker-end="url(#arrow)"/>
    <text x="489" y="250" text-anchor="middle">④ 查术语表</text>
    <line x1="560" y1="280" x2="422" y2="280" stroke="#3b7d4f" stroke-width="1.3" marker-end="url(#arrowback)"/>
    <text x="489" y="274" text-anchor="middle" fill="#2f7a47">中文→英文符号</text>

    <!-- 5 locate -->
    <line x1="420" y1="310" x2="558" y2="310" stroke="#5b6573" stroke-width="1.3" marker-end="url(#arrow)"/>
    <text x="489" y="304" text-anchor="middle">⑤ CodeGraph 定位</text>
    <line x1="560" y1="334" x2="422" y2="334" stroke="#3b7d4f" stroke-width="1.3" marker-end="url(#arrowback)"/>
    <text x="489" y="328" text-anchor="middle" fill="#2f7a47">哪个工程 / 哪些文件</text>

    <!-- 6 read -->
    <line x1="420" y1="364" x2="558" y2="364" stroke="#5b6573" stroke-width="1.3" marker-end="url(#arrow)"/>
    <text x="489" y="358" text-anchor="middle">⑥ 精准读文件（最新主分支源码 / 配置表）</text>
    <line x1="560" y1="388" x2="422" y2="388" stroke="#3b7d4f" stroke-width="1.3" marker-end="url(#arrowback)"/>
    <text x="489" y="382" text-anchor="middle" fill="#2f7a47">真实代码内容</text>

    <!-- loop note -->
    <rect x="448" y="240" width="22" height="160" rx="3" fill="none" stroke="#c7ccd4" stroke-width="1" stroke-dasharray="2,3"/>
    <text x="459" y="412" text-anchor="middle" font-size="9" fill="#9aa3b0" transform="rotate(0 459 412)">按需多轮</text>

    <!-- 7 stream tokens back -->
    <line x1="418" y1="442" x2="252" y2="442" stroke="#3b7d4f" stroke-width="1.3" marker-end="url(#arrowback)"/>
    <text x="334" y="436" text-anchor="middle" fill="#2f7a47">⑦ 流式产出（SSE：结论先行 + 业务语言）</text>

    <!-- 8 update card -->
    <line x1="250" y1="472" x2="687" y2="472" stroke="#3b7d4f" stroke-width="1.3" marker-end="url(#arrowback)"/>
    <text x="470" y="466" text-anchor="middle" fill="#2f7a47">⑧ 流式更新卡片（单 markdown 组件 · 注意频控）</text>

    <!-- 9 finalize -->
    <line x1="250" y1="502" x2="687" y2="502" stroke="#3b7d4f" stroke-width="1.3" marker-end="url(#arrowback)"/>
    <text x="470" y="496" text-anchor="middle" fill="#2f7a47">⑨ 收尾：「供研发复核」折叠区列 文件:行号 + 追问按钮</text>
    <line x1="689" y1="528" x2="82" y2="528" stroke="#3b7d4f" stroke-width="1.3" marker-end="url(#arrowback)"/>
    <text x="385" y="522" text-anchor="middle" fill="#2f7a47">成品卡片 · 可点「继续追问」或回复卡片带上文续问</text>
  </g>

  <text x="380" y="558" text-anchor="middle" font-size="10.5" fill="#7a8493">全程只读取证 · 会话 microVM 不挂任何文件系统 · 工作原理见 docs/agent/architecture.md</text>
</svg>
