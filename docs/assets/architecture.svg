<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6573"/>
    </marker>
    <marker id="arrowgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b7d4f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="600" fill="#ffffff"/>
  <text x="380" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2733">source-truth 架构</text>
  <text x="380" y="62" text-anchor="middle" font-size="12.5" fill="#7a8493">一台机器跑多个项目，项目和会话各自隔离，共享一份只读代码</text>

  <!-- Feishu clients: one bot per project -->
  <rect x="200" y="84" width="360" height="46" rx="8" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.2"/>
  <text x="380" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2733">飞书客户端</text>
  <text x="380" y="122" text-anchor="middle" font-size="10.5" fill="#7a8493">每个项目一个机器人，各用独立飞书 App</text>

  <!-- two project lanes (gateway + sessions only) -->
  <!-- lane A -->
  <rect x="40" y="156" width="330" height="184" rx="10" fill="#fafbfd" stroke="#cdd5e0" stroke-width="1.2"/>
  <text x="205" y="178" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4556">项目 A</text>
  <!-- lane B -->
  <rect x="390" y="156" width="330" height="184" rx="10" fill="#fafbfd" stroke="#cdd5e0" stroke-width="1.2"/>
  <text x="555" y="178" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4556">项目 B</text>

  <!-- gateway A -->
  <rect x="64" y="194" width="282" height="44" rx="8" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.2"/>
  <text x="205" y="212" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2733">bot-gateway</text>
  <text x="205" y="228" text-anchor="middle" font-size="10" fill="#7a8493">长连接收消息，按会话分发</text>
  <!-- gateway B -->
  <rect x="414" y="194" width="282" height="44" rx="8" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.2"/>
  <text x="555" y="212" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2733">bot-gateway</text>
  <text x="555" y="228" text-anchor="middle" font-size="10" fill="#7a8493">长连接收消息，按会话分发</text>

  <!-- runtime A: sessions -->
  <text x="205" y="262" text-anchor="middle" font-size="10" fill="#9aa3b0">AgentCore Runtime · 每个会话一台独立 microVM</text>
  <rect x="64" y="270" width="134" height="46" rx="7" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.1"/>
  <text x="131" y="290" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2733">会话 A1</text>
  <text x="131" y="306" text-anchor="middle" font-size="9.5" fill="#7a8493">Claude Code Agent</text>
  <rect x="212" y="270" width="134" height="46" rx="7" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.1"/>
  <text x="279" y="290" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2733">会话 A2</text>
  <text x="279" y="306" text-anchor="middle" font-size="9.5" fill="#7a8493">Claude Code Agent</text>
  <!-- runtime B: sessions -->
  <text x="555" y="262" text-anchor="middle" font-size="10" fill="#9aa3b0">AgentCore Runtime · 每个会话一台独立 microVM</text>
  <rect x="414" y="270" width="134" height="46" rx="7" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.1"/>
  <text x="481" y="290" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2733">会话 B1</text>
  <text x="481" y="306" text-anchor="middle" font-size="9.5" fill="#7a8493">Claude Code Agent</text>
  <rect x="562" y="270" width="134" height="46" rx="7" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.1"/>
  <text x="629" y="290" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2733">会话 B2</text>
  <text x="629" y="306" text-anchor="middle" font-size="9.5" fill="#7a8493">Claude Code Agent</text>

  <!-- edges: clients -> gateways -->
  <line x1="380" y1="130" x2="205" y2="194" stroke="#5b6573" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="380" y1="130" x2="555" y2="194" stroke="#5b6573" stroke-width="1.3" marker-end="url(#arrow)"/>
  <!-- edges: gateway -> sessions -->
  <line x1="205" y1="238" x2="205" y2="270" stroke="#5b6573" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="555" y1="238" x2="555" y2="270" stroke="#5b6573" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- read-only evidence label between lanes and shared host -->
  <text x="380" y="358" text-anchor="middle" font-size="10" fill="#3b7d4f" font-weight="600">只读不改：会话不挂文件系统，全程用 HTTP 读代码取证</text>
  <!-- edges: sessions -> shared index host -->
  <line x1="205" y1="316" x2="205" y2="372" stroke="#3b7d4f" stroke-width="1.3" marker-end="url(#arrowgreen)"/>
  <line x1="555" y1="316" x2="555" y2="372" stroke="#3b7d4f" stroke-width="1.3" marker-end="url(#arrowgreen)"/>

  <!-- shared index-service host: now physically CONTAINS both bridges -->
  <rect x="40" y="372" width="680" height="172" rx="10" fill="#f4f7f4" stroke="#bcd6c2" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="380" y="394" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3b7d4f">同一台 index-service 主机，全项目共用唯一一份只读代码</text>
  <text x="380" y="412" text-anchor="middle" font-size="10.5" fill="#5b6573">代码存在本地磁盘 /data/repo/&lt;subdir&gt;，定时 git pull 刷新，离线建好索引和术语表</text>

  <!-- bridge A (inside the shared host) -->
  <rect x="64" y="426" width="282" height="104" rx="8" fill="#eef6ef" stroke="#9cc6a8" stroke-width="1.2"/>
  <text x="205" y="446" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2733">index-bridge · 项目 A（独立进程、独立端口）</text>
  <rect x="78" y="458" width="120" height="58" rx="6" fill="#ffffff" stroke="#9cc6a8" stroke-width="1.1"/>
  <text x="138" y="482" text-anchor="middle" font-size="10" font-weight="600" fill="#1f2733">客户端仓</text>
  <text x="138" y="498" text-anchor="middle" font-size="8.5" fill="#7a8493">独立 graph.db</text>
  <rect x="212" y="458" width="120" height="58" rx="6" fill="#ffffff" stroke="#9cc6a8" stroke-width="1.1"/>
  <text x="272" y="482" text-anchor="middle" font-size="10" font-weight="600" fill="#1f2733">服务端仓</text>
  <text x="272" y="498" text-anchor="middle" font-size="8.5" fill="#7a8493">独立 graph.db</text>

  <!-- bridge B (inside the shared host) -->
  <rect x="414" y="426" width="282" height="104" rx="8" fill="#eef6ef" stroke="#9cc6a8" stroke-width="1.2"/>
  <text x="555" y="446" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2733">index-bridge · 项目 B（独立进程、独立端口）</text>
  <rect x="428" y="458" width="120" height="58" rx="6" fill="#ffffff" stroke="#9cc6a8" stroke-width="1.1"/>
  <text x="488" y="482" text-anchor="middle" font-size="10" font-weight="600" fill="#1f2733">仓库 1</text>
  <text x="488" y="498" text-anchor="middle" font-size="8.5" fill="#7a8493">独立 graph.db</text>
  <rect x="562" y="458" width="120" height="58" rx="6" fill="#ffffff" stroke="#9cc6a8" stroke-width="1.1"/>
  <text x="622" y="482" text-anchor="middle" font-size="10" font-weight="600" fill="#1f2733">仓库 2</text>
  <text x="622" y="498" text-anchor="middle" font-size="8.5" fill="#7a8493">独立 graph.db</text>

  <!-- isolation note -->
  <text x="380" y="572" text-anchor="middle" font-size="10.5" fill="#aab2bd">项目之间靠进程、端口和访问范围隔开；同一项目的多个仓库一起检索，按相关度合并结果</text>
</svg>
