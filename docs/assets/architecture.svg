<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6573"/>
    </marker>
    <marker id="arrowgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b7d4f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="560" fill="#ffffff"/>
  <text x="360" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2733">source-truth 架构</text>
  <text x="360" y="62" text-anchor="middle" font-size="12.5" fill="#7a8493">多会话各自隔离 · 共享同一份只读代码副本</text>

  <!-- box 1: Feishu client -->
  <rect x="220" y="86" width="280" height="50" rx="8" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.2"/>
  <text x="360" y="116" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2733">飞书客户端</text>

  <!-- box 2: gateway -->
  <rect x="220" y="172" width="280" height="50" rx="8" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.2"/>
  <text x="360" y="202" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2733">bot-gateway（网关，单实例）</text>

  <!-- edge feishu -> gateway -->
  <line x1="360" y1="136" x2="360" y2="172" stroke="#5b6573" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="372" y="158" font-size="11" fill="#7a8493">@机器人提问</text>

  <!-- session band -->
  <text x="150" y="258" text-anchor="middle" font-size="11" fill="#9aa3b0" font-weight="600">每会话独立、互不可见</text>
  <g>
    <rect x="60" y="268" width="180" height="56" rx="8" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.2"/>
    <text x="150" y="293" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2733">会话 A</text>
    <text x="150" y="312" text-anchor="middle" font-size="10.5" fill="#7a8493">Claude Code Agent</text>
  </g>
  <g>
    <rect x="270" y="268" width="180" height="56" rx="8" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.2"/>
    <text x="360" y="293" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2733">会话 B</text>
    <text x="360" y="312" text-anchor="middle" font-size="10.5" fill="#7a8493">Claude Code Agent</text>
  </g>
  <g>
    <rect x="480" y="268" width="180" height="56" rx="8" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.2"/>
    <text x="570" y="293" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2733">会话 C</text>
    <text x="570" y="312" text-anchor="middle" font-size="10.5" fill="#7a8493">Claude Code Agent</text>
  </g>

  <!-- gateway -> sessions -->
  <line x1="320" y1="222" x2="170" y2="268" stroke="#5b6573" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="360" y1="222" x2="360" y2="268" stroke="#5b6573" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="400" y1="222" x2="550" y2="268" stroke="#5b6573" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="372" y="246" font-size="11" fill="#7a8493">按会话路由</text>

  <!-- sessions fan-in to shared index-service -->
  <line x1="150" y1="324" x2="300" y2="410" stroke="#5b6573" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="360" y1="324" x2="360" y2="410" stroke="#5b6573" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="570" y1="324" x2="420" y2="410" stroke="#5b6573" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="360" y="364" text-anchor="middle" font-size="11" fill="#7a8493">只读取证（先定位，再读文件）</text>

  <!-- shared index-service -->
  <text x="360" y="404" text-anchor="middle" font-size="11.5" fill="#3b7d4f" font-weight="600">共享只读 · 所有会话共用</text>
  <rect x="130" y="416" width="460" height="78" rx="8" fill="#eef6ef" stroke="#9cc6a8" stroke-width="1.2"/>
  <text x="360" y="442" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2733">index-service（唯一一份代码副本）</text>
  <rect x="152" y="454" width="196" height="30" rx="6" fill="#ffffff" stroke="#9cc6a8" stroke-width="1.1"/>
  <text x="250" y="474" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2733">单仓索引（MVP）</text>
  <rect x="372" y="454" width="196" height="30" rx="6" fill="#f4f5f7" stroke="#c2c8d2" stroke-width="1.1" stroke-dasharray="5,4"/>
  <text x="470" y="474" text-anchor="middle" font-size="11" fill="#9aa3b0">多仓库隔离（post-MVP）</text>

  <!-- return edge -->
  <path d="M590,455 C660,455 660,111 500,111" fill="none" stroke="#3b7d4f" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowgreen)"/>
  <text x="678" y="283" text-anchor="middle" font-size="11" fill="#3b7d4f" transform="rotate(-90 678 283)">答案流式回填</text>

  <text x="360" y="532" text-anchor="middle" font-size="10.5" fill="#aab2bd">虚线 = post-MVP 规划，当前仅单仓</text>
</svg>
