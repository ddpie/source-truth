<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6573"/>
    </marker>
    <marker id="arrowgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b7d4f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="560" fill="#ffffff"/>
  <text x="380" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2733">source-truth — 一次提问如何穿过系统</text>
  <text x="380" y="60" text-anchor="middle" font-size="12.5" fill="#7a8493">代码为唯一依据 · 三个有状态组件 · 会话隔离 · 全程只读</text>

  <!-- lane labels (left gutter) -->
  <text x="40" y="120" font-size="11.5" fill="#9aa3b0" font-weight="600">飞书侧</text>
  <text x="40" y="236" font-size="11.5" fill="#9aa3b0" font-weight="600">网关</text>
  <text x="40" y="352" font-size="11.5" fill="#9aa3b0" font-weight="600">会话隔离</text>
  <text x="40" y="468" font-size="11.5" fill="#9aa3b0" font-weight="600">唯一副本</text>

  <!-- box 1: Feishu client -->
  <rect x="180" y="88" width="400" height="64" rx="8" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.2"/>
  <text x="380" y="116" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1f2733">飞书客户端</text>
  <text x="380" y="137" text-anchor="middle" font-size="12" fill="#5b6573">策划 / QA 在群里 @机器人提问 · CardKit 卡片回看答案</text>

  <!-- box 2: gateway -->
  <rect x="180" y="204" width="400" height="64" rx="8" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.2"/>
  <text x="380" y="232" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1f2733">bot-gateway (TypeScript 长驻)</text>
  <text x="380" y="253" text-anchor="middle" font-size="12" fill="#5b6573">单 WSClient 消费事件 · 按会话路由 · CardKit 流式渲染</text>

  <!-- box 3: microVM agent -->
  <rect x="180" y="320" width="400" height="64" rx="8" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.2"/>
  <text x="380" y="348" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1f2733">AgentCore microVM · 每会话独立</text>
  <text x="380" y="369" text-anchor="middle" font-size="12" fill="#5b6573">Claude Code Agent (Python) · 不挂任何文件系统</text>

  <!-- box 4: index-service -->
  <rect x="180" y="436" width="400" height="64" rx="8" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.2"/>
  <text x="380" y="464" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1f2733">index-service (常驻)</text>
  <text x="380" y="485" text-anchor="middle" font-size="12" fill="#5b6573">CodeGraph 图 + 文件桥 · 本地磁盘持唯一代码副本</text>

  <!-- edges with labels (center-anchored, stay inside the box column, clear of the return curve) -->
  <line x1="380" y1="152" x2="380" y2="204" stroke="#5b6573" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="380" y="180" text-anchor="middle" font-size="11.5" fill="#7a8493">长连接事件订阅</text>

  <line x1="380" y1="268" x2="380" y2="320" stroke="#5b6573" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="380" y="296" text-anchor="middle" font-size="11.5" fill="#7a8493">InvokeAgentRuntime · runtimeSessionId 路由 + SigV4</text>

  <line x1="380" y1="384" x2="380" y2="436" stroke="#5b6573" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="380" y="412" text-anchor="middle" font-size="11.5" fill="#7a8493">MCP-over-HTTP（只读：先定位、再读文件）</text>

  <!-- return edge: answer streams back up the right side, anchored to box edges -->
  <path d="M580,468 C660,468 660,120 580,120" fill="none" stroke="#3b7d4f" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowgreen)"/>
  <text x="690" y="294" text-anchor="middle" font-size="11.5" fill="#3b7d4f" transform="rotate(-90 690 294)">结论流式回填卡片</text>

  <text x="380" y="536" text-anchor="middle" font-size="11.5" fill="#9aa3b0">代码与索引为部署时快照 · 更新主分支须重新部署 index-service（无 webhook/inotify）</text>
</svg>
