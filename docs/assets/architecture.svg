<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6573"/>
    </marker>
    <marker id="arrowgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b7d4f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="600" fill="#ffffff"/>
  <text x="380" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2733">source-truth 架构</text>
  <text x="380" y="62" text-anchor="middle" font-size="12.5" fill="#7a8493">单机多项目（逻辑隔离）· 项目内多会话各自隔离 · 共享只读代码副本</text>

  <!-- Feishu clients: one bot per project -->
  <rect x="200" y="84" width="360" height="46" rx="8" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.2"/>
  <text x="380" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2733">飞书客户端</text>
  <text x="380" y="122" text-anchor="middle" font-size="10.5" fill="#7a8493">每个游戏项目一个机器人（各自独立飞书 App）</text>

  <!-- two project lanes -->
  <!-- lane A -->
  <rect x="40" y="156" width="330" height="300" rx="10" fill="#fafbfd" stroke="#cdd5e0" stroke-width="1.2"/>
  <text x="205" y="178" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4556">项目 A（机器人 A）</text>
  <!-- lane B -->
  <rect x="390" y="156" width="330" height="300" rx="10" fill="#fafbfd" stroke="#cdd5e0" stroke-width="1.2"/>
  <text x="555" y="178" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4556">项目 B（机器人 B）</text>

  <!-- gateway A -->
  <rect x="64" y="194" width="282" height="44" rx="8" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.2"/>
  <text x="205" y="212" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2733">bot-gateway@项目A</text>
  <text x="205" y="228" text-anchor="middle" font-size="10" fill="#7a8493">长连接订阅 · 按会话路由</text>
  <!-- gateway B -->
  <rect x="414" y="194" width="282" height="44" rx="8" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.2"/>
  <text x="555" y="212" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2733">bot-gateway@项目B</text>
  <text x="555" y="228" text-anchor="middle" font-size="10" fill="#7a8493">长连接订阅 · 按会话路由</text>

  <!-- runtime A: sessions -->
  <text x="205" y="262" text-anchor="middle" font-size="10" fill="#9aa3b0">Runtime source_truth_agent_项目A · 每会话独立 microVM</text>
  <rect x="64" y="270" width="134" height="46" rx="7" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.1"/>
  <text x="131" y="290" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2733">会话 A1</text>
  <text x="131" y="306" text-anchor="middle" font-size="9.5" fill="#7a8493">Claude Code Agent</text>
  <rect x="212" y="270" width="134" height="46" rx="7" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.1"/>
  <text x="279" y="290" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2733">会话 A2</text>
  <text x="279" y="306" text-anchor="middle" font-size="9.5" fill="#7a8493">Claude Code Agent</text>
  <!-- runtime B: sessions -->
  <text x="555" y="262" text-anchor="middle" font-size="10" fill="#9aa3b0">Runtime source_truth_agent_项目B · 每会话独立 microVM</text>
  <rect x="414" y="270" width="134" height="46" rx="7" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.1"/>
  <text x="481" y="290" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2733">会话 B1</text>
  <text x="481" y="306" text-anchor="middle" font-size="9.5" fill="#7a8493">Claude Code Agent</text>
  <rect x="562" y="270" width="134" height="46" rx="7" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.1"/>
  <text x="629" y="290" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2733">会话 B2</text>
  <text x="629" y="306" text-anchor="middle" font-size="9.5" fill="#7a8493">Claude Code Agent</text>

  <!-- bridge A (per-project, multi-repo) -->
  <text x="205" y="352" text-anchor="middle" font-size="10" fill="#3b7d4f" font-weight="600">只读取证（先定位，再读文件）</text>
  <rect x="64" y="360" width="282" height="82" rx="8" fill="#eef6ef" stroke="#9cc6a8" stroke-width="1.2"/>
  <text x="205" y="380" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2733">index-bridge-项目A（独立端口）</text>
  <rect x="78" y="392" width="120" height="38" rx="6" fill="#ffffff" stroke="#9cc6a8" stroke-width="1.1"/>
  <text x="138" y="409" text-anchor="middle" font-size="10" font-weight="600" fill="#1f2733">客户端仓</text>
  <text x="138" y="423" text-anchor="middle" font-size="8.5" fill="#7a8493">独立 graph.db</text>
  <rect x="212" y="392" width="120" height="38" rx="6" fill="#ffffff" stroke="#9cc6a8" stroke-width="1.1"/>
  <text x="272" y="409" text-anchor="middle" font-size="10" font-weight="600" fill="#1f2733">服务端仓</text>
  <text x="272" y="423" text-anchor="middle" font-size="8.5" fill="#7a8493">独立 graph.db</text>
  <!-- bridge B -->
  <rect x="414" y="360" width="282" height="82" rx="8" fill="#eef6ef" stroke="#9cc6a8" stroke-width="1.2"/>
  <text x="555" y="380" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2733">index-bridge-项目B（独立端口）</text>
  <rect x="428" y="392" width="120" height="38" rx="6" fill="#ffffff" stroke="#9cc6a8" stroke-width="1.1"/>
  <text x="488" y="409" text-anchor="middle" font-size="10" font-weight="600" fill="#1f2733">仓库 1</text>
  <text x="488" y="423" text-anchor="middle" font-size="8.5" fill="#7a8493">独立 graph.db</text>
  <rect x="562" y="392" width="120" height="38" rx="6" fill="#ffffff" stroke="#9cc6a8" stroke-width="1.1"/>
  <text x="622" y="409" text-anchor="middle" font-size="10" font-weight="600" fill="#1f2733">仓库 2</text>
  <text x="622" y="423" text-anchor="middle" font-size="8.5" fill="#7a8493">独立 graph.db</text>

  <!-- edges within lane A -->
  <line x1="380" y1="130" x2="205" y2="194" stroke="#5b6573" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="380" y1="130" x2="555" y2="194" stroke="#5b6573" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="205" y1="238" x2="205" y2="270" stroke="#5b6573" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="205" y1="316" x2="205" y2="360" stroke="#5b6573" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="555" y1="238" x2="555" y2="270" stroke="#5b6573" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="555" y1="316" x2="555" y2="360" stroke="#5b6573" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- shared index host band -->
  <rect x="40" y="474" width="680" height="58" rx="9" fill="#f4f7f4" stroke="#bcd6c2" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="380" y="497" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3b7d4f">同一台 index-service 主机（所有项目的 bridge 同机共存，按项目 scope 隔离）</text>
  <text x="380" y="517" text-anchor="middle" font-size="10.5" fill="#5b6573">唯一一份代码副本只在本地磁盘 /data/repo/&lt;subdir&gt; · 定时 git pull 刷新 · 会话 microVM 不挂任何文件系统</text>

  <!-- isolation note -->
  <text x="380" y="560" text-anchor="middle" font-size="10.5" fill="#aab2bd">项目间彻底隔离（进程 + 端口 + 服务端 scope gate）：bridge 进程里没有别项目的图，模型无法越权访问</text>
  <text x="380" y="578" text-anchor="middle" font-size="10.5" fill="#aab2bd">项目内多仓联合检索：指定仓库只查该仓，不指定则各仓分头查、按相关度合并</text>
</svg>
