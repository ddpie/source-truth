<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6573"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2733">会话隔离：什么共享、什么隔离</text>
  <text x="380" y="56" text-anchor="middle" font-size="12.5" fill="#7a8493">每个游戏项目一个机器人 · 机器人内按会话隔离 · 多会话共用唯一只读代码副本</text>

  <!-- three per-session microVMs (each isolated) -->
  <text x="380" y="92" text-anchor="middle" font-size="11.5" font-weight="600" fill="#9aa3b0">per-session 独占（仅本 microVM 可见 · 约 14 天空闲过期）</text>

  <g>
    <rect x="70" y="106" width="190" height="92" rx="8" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.2"/>
    <text x="165" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2733">会话 A · microVM</text>
    <text x="165" y="150" text-anchor="middle" font-size="11" fill="#5b6573">Claude Code Agent</text>
    <text x="165" y="180" text-anchor="middle" font-size="10.5" fill="#7a8493">/mnt/workspace 临时文件</text>
  </g>
  <g>
    <rect x="285" y="106" width="190" height="92" rx="8" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.2"/>
    <text x="380" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2733">会话 B · microVM</text>
    <text x="380" y="150" text-anchor="middle" font-size="11" fill="#5b6573">Claude Code Agent</text>
    <text x="380" y="180" text-anchor="middle" font-size="10.5" fill="#7a8493">/mnt/workspace 临时文件</text>
  </g>
  <g>
    <rect x="500" y="106" width="190" height="92" rx="8" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.2"/>
    <text x="595" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2733">会话 C · microVM</text>
    <text x="595" y="150" text-anchor="middle" font-size="11" fill="#5b6573">Claude Code Agent</text>
    <text x="595" y="180" text-anchor="middle" font-size="10.5" fill="#7a8493">/mnt/workspace 临时文件</text>
  </g>

  <!-- arrows fan-in to the shared index-service (read-only) -->
  <line x1="165" y1="198" x2="350" y2="300" stroke="#5b6573" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="380" y1="198" x2="380" y2="300" stroke="#5b6573" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="595" y1="198" x2="410" y2="300" stroke="#5b6573" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="455" y="232" text-anchor="middle" font-size="10.5" fill="#7a8493">MCP-over-HTTP（只读）</text>

  <!-- shared index-service (read-only, single copy) -->
  <text x="380" y="294" text-anchor="middle" font-size="11.5" font-weight="600" fill="#3b7d4f">共享只读（所有会话 · 部署时构建一次 · 重部署刷新）</text>
  <rect x="150" y="306" width="460" height="86" rx="8" fill="#eef6ef" stroke="#9cc6a8" stroke-width="1.2"/>
  <text x="380" y="332" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2733">index-service（常驻 · 唯一一份代码副本）</text>
  <text x="380" y="354" text-anchor="middle" font-size="11.5" fill="#5b6573">CodeGraph 索引 + HTTP 读取接口 · 本地磁盘 /data/repo/&lt;subdir&gt;</text>
  <text x="380" y="375" text-anchor="middle" font-size="11" fill="#3b7d4f">项目代码（主分支）+ 配置表 · 全部会话只读访问，互不写扰</text>
</svg>
