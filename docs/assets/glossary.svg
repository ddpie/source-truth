<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6573"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b7d4f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="500" fill="#ffffff"/>
  <text x="390" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2733">术语表：让中文提问命中英文代码</text>
  <text x="390" y="56" text-anchor="middle" font-size="12.5" fill="#7a8493">中文词 → 代码里真实出现的英文符号 · 派生提示，结论仍以实读代码为准</text>

  <!-- ===== 构建期（左半，离线）===== -->
  <rect x="24" y="80" width="360" height="300" rx="10" fill="#fbfbfc" stroke="#d7dde6" stroke-width="1.2"/>
  <text x="40" y="104" font-size="13" font-weight="700" fill="#1f2733">构建期（index 主机，离线）</text>
  <text x="40" y="122" font-size="10.5" fill="#7a8493">无用户输入 · 不在请求路径 · 跟 git 刷新同节拍</text>

  <rect x="44" y="138" width="320" height="46" rx="8" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.1"/>
  <text x="60" y="159" font-size="12.5" font-weight="600" fill="#1f2733">① 本地代码副本 /data/repo/&lt;仓&gt;</text>
  <text x="60" y="176" font-size="10.5" fill="#5b6573">首建全量；刷新按 git diff 只扫变更文件（增量）</text>

  <rect x="44" y="198" width="320" height="52" rx="8" fill="#fbf4e8" stroke="#e0c48f" stroke-width="1.1"/>
  <text x="60" y="219" font-size="12.5" font-weight="600" fill="#1f2733">② 本地 claude (cc) 扫码产出对照</text>
  <text x="60" y="236" font-size="10.5" fill="#8a6520">已锁定：禁写/执行/联网/子代理 · 不加载仓内 .claude</text>

  <rect x="44" y="264" width="320" height="52" rx="8" fill="#eef6ef" stroke="#9cc6a8" stroke-width="1.1"/>
  <text x="60" y="285" font-size="12.5" font-weight="600" fill="#1f2733">③ grounding 校验（确定性把关）</text>
  <text x="60" y="302" font-size="10.5" fill="#3b7d4f">中文须真出现在源文件，否则丢弃；文档来源降一档</text>

  <rect x="44" y="330" width="320" height="40" rx="8" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.1"/>
  <text x="60" y="355" font-size="12.5" font-weight="600" fill="#1f2733">④ 术语表 /data/glossary/&lt;项目&gt;/&lt;仓&gt;.jsonl</text>

  <line x1="204" y1="184" x2="204" y2="198" stroke="#5b6573" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="204" y1="250" x2="204" y2="264" stroke="#5b6573" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="204" y1="316" x2="204" y2="330" stroke="#5b6573" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- ===== 查询期（右半，请求路径）===== -->
  <rect x="408" y="80" width="348" height="300" rx="10" fill="#fbfbfc" stroke="#d7dde6" stroke-width="1.2"/>
  <text x="424" y="104" font-size="13" font-weight="700" fill="#1f2733">查询期（会话 microVM）</text>
  <text x="424" y="122" font-size="10.5" fill="#7a8493">两个只读工具 · 项目隔离 · 经 index-service HTTP</text>

  <rect x="428" y="138" width="308" height="46" rx="8" fill="#f4f0fa" stroke="#c9b8e6" stroke-width="1.1"/>
  <text x="444" y="159" font-size="12.5" font-weight="600" fill="#1f2733">策划提问：「成就怎么算」</text>
  <text x="444" y="176" font-size="10.5" fill="#5b6573">中文业务词，直搜英文代码命中不到</text>

  <rect x="428" y="200" width="308" height="52" rx="8" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.1"/>
  <text x="444" y="221" font-size="12.5" font-weight="600" fill="#1f2733">glossary_lookup（按中文词查）</text>
  <text x="444" y="238" font-size="10.5" fill="#5b6573">成就 → Achievement / Status / Points …</text>

  <rect x="428" y="268" width="308" height="52" rx="8" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.1"/>
  <text x="444" y="289" font-size="12.5" font-weight="600" fill="#1f2733">用英文符号检索 + 实读代码取证</text>
  <text x="444" y="306" font-size="10.5" fill="#5b6573">search_files / symbol_search / read_file</text>

  <rect x="428" y="336" width="308" height="34" rx="8" fill="#eef6ef" stroke="#9cc6a8" stroke-width="1.1"/>
  <text x="582" y="358" text-anchor="middle" font-size="12" font-weight="600" fill="#3b7d4f">基于真实代码的答案</text>

  <line x1="582" y1="184" x2="582" y2="200" stroke="#5b6573" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="582" y1="252" x2="582" y2="268" stroke="#5b6573" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="582" y1="320" x2="582" y2="336" stroke="#5b6573" stroke-width="1.4" marker-end="url(#arg)"/>

  <!-- 构建期产物 → 查询期工具 -->
  <path d="M364,350 C396,350 396,226 428,226" fill="none" stroke="#3b7d4f" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arg)"/>
  <text x="396" y="296" text-anchor="middle" font-size="10" fill="#3b7d4f" transform="rotate(-90 396 296)">术语表供查询</text>

  <!-- 底部一句话边界 -->
  <text x="390" y="410" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2733">价值边界</text>
  <text x="390" y="430" text-anchor="middle" font-size="11" fill="#5b6573">中文与符号相邻（注释 / 配置表表头）时价值最高——配对率近满</text>
  <text x="390" y="449" text-anchor="middle" font-size="11" fill="#5b6573">纯英文代码：术语表为空但无害，agent 自动跳过</text>
  <text x="390" y="468" text-anchor="middle" font-size="11" fill="#5b6573">覆盖率随构建文件上限（MAX_BUILD_FILES）上升，大项目以成本换覆盖</text>
</svg>
