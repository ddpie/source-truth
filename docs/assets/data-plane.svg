<svg xmlns="http://www.w3.org/2000/svg" width="760" height="486" viewBox="0 0 760 486" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6573"/>
    </marker>
    <marker id="arrowloop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c98a2b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="486" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2733">数据面：代码如何进入 index-service、索引如何刷新</text>
  <text x="380" y="56" text-anchor="middle" font-size="12.5" fill="#7a8493">git 仓定时 pull · 本地仓手动推送 · 常驻 watcher 增量重建 · 分钟级反映，无需重部署</text>

  <!-- 5 stacked stages, x=120 w=520 -->
  <!-- stage 1 -->
  <rect x="120" y="78" width="520" height="52" rx="8" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.2"/>
  <text x="140" y="102" font-size="13.5" font-weight="600" fill="#1f2733">① activate_project.sh（经 SSM，按项目）</text>
  <text x="140" y="121" font-size="11.5" fill="#5b6573">git 仓用只读凭证 clone（本地仓经 rsync 推送）→ index-service 本地磁盘 /data/repo/&lt;subdir&gt;</text>

  <!-- stage 2 -->
  <rect x="120" y="154" width="520" height="52" rx="8" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.2"/>
  <text x="140" y="178" font-size="13.5" font-weight="600" fill="#1f2733">② index-build@&lt;subdir&gt;.service · 每仓建图（flock 独占写入）</text>
  <text x="140" y="197" font-size="11.5" fill="#5b6573">codegraph-server --graph-only 建该仓 graph.db（每仓独立图 / HOME / 写锁）</text>

  <!-- stage 3 -->
  <rect x="120" y="230" width="520" height="52" rx="8" fill="#eef3fb" stroke="#b9c9e6" stroke-width="1.2"/>
  <text x="140" y="254" font-size="13.5" font-weight="600" fill="#1f2733">③ index-bridge-&lt;projectId&gt;.service · 每项目一个常驻只读</text>
  <text x="140" y="273" font-size="11.5" fill="#5b6573">codegraph-server --mcp（内存图）+ http_bridge 暴露 HTTP；各占独立端口，仅服务本项目仓库</text>

  <!-- stage 4 (refresh, accent amber) -->
  <rect x="120" y="306" width="520" height="52" rx="8" fill="#fbf4e8" stroke="#e0c48f" stroke-width="1.2"/>
  <text x="140" y="330" font-size="13.5" font-weight="600" fill="#1f2733">④ index-refresh-&lt;subdir&gt;.timer · 定时刷新（默认 300s）</text>
  <text x="140" y="349" font-size="11.5" fill="#8a6520">git pull → 常驻进程的 file-watcher 数秒内增量重建内存图（无重启 / 无第二写者）</text>

  <!-- stage 5 (consumer, accent green) -->
  <rect x="120" y="400" width="520" height="52" rx="8" fill="#eef6ef" stroke="#9cc6a8" stroke-width="1.2"/>
  <text x="140" y="424" font-size="13.5" font-weight="600" fill="#1f2733">⑤ 会话 microVM 经 HTTP 端点远程读代码</text>
  <text x="140" y="443" font-size="10" fill="#3b7d4f">symbol_search / get_callers / analyze_impact / search_files / read_file / glob_files / read_table</text>

  <!-- connectors centered at x=380 -->
  <line x1="380" y1="130" x2="380" y2="154" stroke="#5b6573" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="380" y1="206" x2="380" y2="230" stroke="#5b6573" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="380" y1="282" x2="380" y2="306" stroke="#5b6573" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="380" y1="358" x2="380" y2="400" stroke="#5b6573" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- refresh loop: stage 4 pulls fresh code (back to disk) + re-feeds the resident bridge graph -->
  <path d="M120,332 C70,332 70,256 110,256" fill="none" stroke="#c98a2b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowloop)"/>
  <text x="58" y="296" text-anchor="middle" font-size="10" fill="#c98a2b" transform="rotate(-90 58 296)">每 300s 拉新 → 增量重建</text>

  <!-- right note -->
  <text x="664" y="268" text-anchor="middle" font-size="11" fill="#9aa3b0" transform="rotate(-90 664 268)">唯一代码副本只在本地磁盘 · git pull / 手动推送刷新</text>
</svg>
